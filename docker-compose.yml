# GD2 local stack: Postgres + Redis + Backend (NestJS) + Indexer.
# Contracts are NOT part of this compose file - run `npx hardhat node` and
# `npx hardhat run scripts/deploy.ts --network localhost` separately in contracts/,
# then fill in VAULT_ADDRESS / STRATEGY_MANAGER_ADDRESS below before `docker compose up`.
#
# Vault Security Audit: mọi credential dưới đây giờ đọc từ .env (copy từ .env.example),
# KHÔNG còn hardcode "postgres"/"admin" ngầm định - nếu thiếu, compose fail-fast thay vì
# âm thầm chạy với credential mặc định ai cũng đoán được. Port của Postgres/Redis/
# Grafana/Prometheus/Alertmanager chỉ bind 127.0.0.1 (không mở ra LAN/Internet); risk-
# engine/ai-engine không publish port ra host nữa - backend gọi qua network nội bộ
# Docker (risk-engine:8002/ai-engine:8001), test trực tiếp bằng `docker compose exec`.
name: yield-vault

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: yield_vault
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (copy .env.example) - no hardcoded default}"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env, see .env.example}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RPC_URL: ${RPC_URL:-http://host.docker.internal:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@postgres:5432/yield_vault
      VAULT_ADDRESS: ${VAULT_ADDRESS}
      STRATEGY_MANAGER_ADDRESS: ${STRATEGY_MANAGER_ADDRESS}
      CONFIRMATIONS: ${CONFIRMATIONS:-3}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
      METRICS_PORT: 9464
    ports:
      - "127.0.0.1:9464:9464"

  risk-engine:
    build:
      context: risk-engine
    restart: unless-stopped
    # Không publish port ra host - chỉ backend (cùng network Docker nội bộ) gọi được,
    # qua http://risk-engine:8002. Debug thủ công: `docker compose exec risk-engine sh`.

  ai-engine:
    build:
      context: ai-engine
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Không publish port ra host - lý do tương tự risk-engine ở trên.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-engine:
        condition: service_started
      ai-engine:
        condition: service_started
    environment:
      PORT: 3001
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@postgres:5432/yield_vault
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env, see .env.example}@redis:6379
      RISK_ENGINE_URL: http://risk-engine:8002
      AI_ENGINE_URL: http://ai-engine:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (copy .env.example) - guards POST /policy/evaluate}
    ports:
      - "3001:3001"

  # --- Observability (PLAN.md GD3 §7) ---

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - indexer

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    # alertmanager.yml is gitignored (copy alertmanager.yml.example and put your real
    # Discord/Telegram webhook URL in it - see the example file for details). Falls back
    # to a placeholder URL that just won't deliver anywhere until you do that.
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (copy .env.example) - no hardcoded default}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
