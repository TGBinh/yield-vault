[project]
name = "risk-engine"
version = "0.1.0"
description = "Deterministic risk scoring + allocation optimization for the AI-Powered Cross-Chain Yield Vault (Phase 3, no ML/LLM - see PLAN.md)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "web3>=6.15",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
