name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  # Vault Security Audit - High: pin forge-std to an exact commit + verify its checksum
  # instead of downloading the moving `master` branch - a compromised repo/CDN could
  # otherwise inject arbitrary code that runs with this workflow's GITHUB_TOKEN.
  FORGE_STD_SHA: "886b4f8b63409ef474542de6394d25a9b5908ed3"
  FORGE_STD_SHA256: "f14d8dede129bf17c91ed2528dc495b40a9cd4bcd06073a156efbd7a1a82ef0c"

# Vault Security Audit - Medium M1: no default `permissions` meant every job (including
# the one downloading forge-std above) got the repo's default GITHUB_TOKEN permissions,
# which can be write-all. Least-privilege default; `deploy-staging` already opts back
# into `packages: write` where it actually needs it.
permissions:
  contents: read

jobs:
  contracts-test:
    name: Contracts - compile, unit tests, non-fork Foundry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # forge-std is intentionally gitignored (contracts/.gitignore) - it was installed
      # locally by downloading the zip directly (git submodules don't work here, see
      # PLAN.md GD3: contracts/ is nested inside an unrelated parent git history) - CI
      # needs the same restore step since it's not in the checked-out tree.
      - name: Restore forge-std
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p lib
          curl -sL -o /tmp/forge-std.zip "https://github.com/foundry-rs/forge-std/archive/${FORGE_STD_SHA}.zip"
          echo "${FORGE_STD_SHA256}  /tmp/forge-std.zip" | sha256sum -c -
          unzip -q /tmp/forge-std.zip -d /tmp
          mv "/tmp/forge-std-${FORGE_STD_SHA}" lib/forge-std
      - name: Hardhat compile
        working-directory: contracts
        run: npx hardhat compile
      - name: Hardhat unit tests
        working-directory: contracts
        run: npx hardhat test
      - name: Foundry unit tests (PendleStrategy - no fork needed)
        working-directory: contracts
        run: forge test --match-contract PendleStrategyTest -v

  contracts-fork-test:
    name: Contracts - Foundry fork tests (real Aave/Morpho testnets)
    runs-on: ubuntu-latest
    # Fork tests hit public testnet RPCs - can be flaky due to shared rate limits or
    # transient testnet state (see PLAN.md GD3 note). Non-blocking for merge on purpose.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Restore forge-std
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p lib
          curl -sL -o /tmp/forge-std.zip "https://github.com/foundry-rs/forge-std/archive/${FORGE_STD_SHA}.zip"
          echo "${FORGE_STD_SHA256}  /tmp/forge-std.zip" | sha256sum -c -
          unzip -q /tmp/forge-std.zip -d /tmp
          mv "/tmp/forge-std-${FORGE_STD_SHA}" lib/forge-std
      - name: Foundry fork tests (Aave + Morpho)
        working-directory: contracts
        run: forge test --match-contract "AaveStrategyForkTest|MorphoStrategyForkTest" -v

  contracts-slither:
    name: Contracts - Slither static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Slither
        # Pinned to the exact version verified locally (--exclude-dependencies --fail-high
        # confirmed exit 0 on this codebase) - an unpinned install can silently pick up a
        # newer release with different exit-code behavior for these flags.
        run: pip install slither-analyzer==0.11.6
      - name: Run Slither (own code only - dependencies excluded)
        working-directory: contracts
        run: slither . --exclude-dependencies --fail-high

  indexer:
    name: Indexer - typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - working-directory: indexer
        run: npm run typecheck
      - working-directory: indexer
        run: npm run build

  backend:
    name: Backend - test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - working-directory: backend
        run: npm test
      - working-directory: backend
        run: npm run build

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run build

  risk-engine:
    name: risk-engine - unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: risk-engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -v

  ai-engine:
    name: ai-engine - unit tests (fallback path only, no API key in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: ai-engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -v

  docker-build:
    name: Build indexer + backend + risk-engine + ai-engine Docker images
    runs-on: ubuntu-latest
    needs: [indexer, backend, risk-engine, ai-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          push: false
          tags: yield-vault-indexer:ci
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: yield-vault-backend:ci
      - name: Build risk-engine image
        uses: docker/build-push-action@v6
        with:
          context: risk-engine
          push: false
          tags: yield-vault-risk-engine:ci
      - name: Build ai-engine image
        uses: docker/build-push-action@v6
        with:
          context: ai-engine
          push: false
          tags: yield-vault-ai-engine:ci

  deploy-staging:
    name: Push images to GitHub Container Registry (staging)
    runs-on: ubuntu-latest
    needs: [contracts-test, contracts-slither, indexer, backend, frontend, risk-engine, ai-engine, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker/OCI image tags must be all-lowercase, but `github.repository` preserves
      # the actual account casing (e.g. "TGBinh/yield-vault") - lowercase it explicitly
      # rather than assuming the repo owner name happens to already be lowercase.
      - name: Compute lowercase image name
        id: image
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Push indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}-indexer:staging
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}-backend:staging
      - name: Push risk-engine image
        uses: docker/build-push-action@v6
        with:
          context: risk-engine
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}-risk-engine:staging
      - name: Push ai-engine image
        uses: docker/build-push-action@v6
        with:
          context: ai-engine
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo }}-ai-engine:staging
