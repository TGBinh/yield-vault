global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: yield-vault-backend
    static_configs:
      - targets: ["backend:3001"]
    metrics_path: /metrics

  - job_name: yield-vault-indexer
    static_configs:
      - targets: ["indexer:9464"]
    metrics_path: /metrics
